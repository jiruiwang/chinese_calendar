<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中國歷朝正朔日曆目録：纪年与朝代檢索</title>
<link rel="stylesheet" href="css/calendar.css?v=20260727-chaodai-popup-compact">
</head>
<body>
<main class="index-shell dual-index">
  <h1><span>中國歷朝正朔日曆</span></h1>

  <div class="index-tabs" role="tablist" aria-label="目録檢索方式">
    <button class="index-tab active" type="button"
            role="tab" aria-selected="true"
            data-target="dynastyPanel">朝代檢索</button>
    <button class="index-tab" type="button"
            role="tab" aria-selected="false"
            data-target="chronologyPanel">紀年檢索</button>
  </div>

  <section class="index-panel" id="chronologyPanel" role="tabpanel" hidden>
    <div class="index-search-box">
      <label for="chronologySearch">輸入中曆年、西曆年、干支或年號</label>
      <div class="search-input-row">
        <input id="chronologySearch" type="search"
               placeholder="例如：0440、0220、庚子、黄初元年"
               autocomplete="off">
        <button id="clearChronology" type="button">清除</button>
      </div>
      <div class="search-help">同時檢索中曆紀年、西曆紀年、年干支及各朝年號。</div>
    </div>
    <div class="result-count" id="chronologyCount"></div>
    <div class="chronology-results" id="chronologyResults"></div>
  </section>

  <section class="index-panel" id="dynastyPanel" role="tabpanel">
    <div class="dynasty-cards" id="dynastyCards"></div>
    <div class="dynasty-heading" id="dynastyHeading"></div>
    <div class="dynasty-results" id="dynastyResults"></div>
  </section>
</main>

<script src="data/index-data.js?v=20260727-bce4-nq"></script>
<script src="js/index.js?v=20260728-qing-pre1864-beiwei"></script>
</body>
</html>
